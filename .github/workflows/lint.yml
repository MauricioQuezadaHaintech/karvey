# Plugin lint and tests (architecture §1.11; REQ-W1-030, REQ-W1-054, REQ-W1-109).
# Read-only: no secrets, no write token, never pull_request_target. Actions are pinned by commit SHA
# (tag in the trailing comment). No pip or npm installs: python 3 and node from the runner only.
# The regression step (tests/regression, BUG-05..21 index) was added by E1.F14.T3.
name: Plugin lint and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 plugins/karvey/scripts/lint-plugin.py --format github
      - run: python3 plugins/karvey/scripts/karvey-state.py validate --all --root .

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # table cases need real git history for origin/* refs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s plugins/karvey/tests/unit -v
      - run: python3 -m unittest discover -s plugins/karvey/tests/regression -v
      - run: python3 plugins/karvey/tests/hooks/run_tables.py --junit tables.xml
      # the tables already ran in the step above (with junit): test-hooks.sh skips them (F-37)
      - run: bash plugins/karvey/hooks/tests/test-hooks.sh
        env:
          KARVEY_SKIP_TABLES: '1'

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: node --test plugins/karvey/tests/page/

  windows-advisory:
    runs-on: windows-latest
    continue-on-error: true # advisory in 3.12.0: path translation and CRLF cases
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # table cases need real git history for origin/* refs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # path translation (C:\, /c/, \\wsl$\), BOM and CRLF payloads and files (F-36)
      - run: cd plugins/karvey/tests/unit && python -m unittest -v test_paths test_hookio test_atomicio
      # the dispatcher through Git Bash: the smoke cases tagged windows (never an empty selection)
      - run: python plugins/karvey/tests/hooks/run_tables.py --tag windows -v
        env:
          # process start-up on Windows runners is ~2x Linux; the 1 s case limit doubles here (F-46)
          KARVEY_TABLES_TIME_FACTOR: '2'
